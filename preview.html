<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Duo 壁纸预览</title>
<style>
:root{--bg:#f4f3f0;--fg:#1d1d1f;--mut:#6e6e73;--card:#fff;--line:#e2e0db;--chip:#ebe9e4;--chipOn:#1d1d1f;--chipOnFg:#fff;--body:#2b2b2e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0f10;--fg:#f2f2f2;--mut:#a1a1a6;--card:#1c1c1e;--line:#2c2c2e;--chip:#2a2a2d;--chipOn:#f2f2f2;--chipOnFg:#111;--body:#3a3a3e}}
:root[data-theme="dark"]{--bg:#0f0f10;--fg:#f2f2f2;--mut:#a1a1a6;--card:#1c1c1e;--line:#2c2c2e;--chip:#2a2a2d;--chipOn:#f2f2f2;--chipOnFg:#111;--body:#3a3a3e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,"PingFang SC","Helvetica Neue",sans-serif}
main{max-width:980px;margin:0 auto;padding:18px 16px 48px}
h1{font-size:22px;margin:0 0 4px} .mut{color:var(--mut);font-size:13px;margin:0}
a{color:inherit}
.sets{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 10px}
.chip{border:0;background:var(--chip);color:var(--fg);padding:7px 12px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--chipOn);color:var(--chipOnFg)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 18px}
.bar .main{background:var(--chipOn);color:var(--chipOnFg);font-weight:600;padding:9px 18px}
.stage{display:flex;justify-content:center;align-items:center;min-height:min(70vh,640px);perspective:2200px}
/* device */
.dev{position:relative;transition:width .7s cubic-bezier(.6,.05,.3,1),height .7s cubic-bezier(.6,.05,.3,1)}
.frame{position:absolute;inset:0;border-radius:var(--r);background:var(--body);padding:var(--bz);box-shadow:0 30px 60px -20px rgba(0,0,0,.45),inset 0 0 0 1.5px rgba(255,255,255,.08)}
.screen{position:relative;width:100%;height:100%;border-radius:calc(var(--r) - var(--bz));overflow:hidden;background:#000}
.screen img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.cam{position:absolute;top:2.2%;width:3.2%;aspect-ratio:1;border-radius:50%;background:#050505;box-shadow:0 0 0 2px rgba(255,255,255,.06);z-index:4}
.crease{position:absolute;top:0;bottom:0;left:50%;width:2px;transform:translateX(-1px);background:linear-gradient(90deg,rgba(0,0,0,.18),rgba(255,255,255,.12),rgba(0,0,0,.18));z-index:3;pointer-events:none}
.lock{position:absolute;top:7%;text-align:center;color:#fff;text-shadow:0 1px 12px rgba(0,0,0,.35);z-index:5;pointer-events:none;font-family:-apple-system,"SF Pro Display","PingFang SC",sans-serif}
.lock .d{font-weight:600;opacity:.92}
.lock .t{font-weight:700;letter-spacing:-.02em;line-height:1}
.icons{position:absolute;z-index:4;display:grid;pointer-events:none}
.icons i{display:block;aspect-ratio:1;border-radius:22%;background:rgba(255,255,255,.28);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
/* flip animation: left panel of the open screen swings in from closed */
.flap{position:absolute;top:0;bottom:0;left:0;width:50%;transform-origin:100% 50%;backface-visibility:hidden;z-index:6;overflow:hidden;transition:transform .7s cubic-bezier(.6,.05,.3,1)}
.flap img{width:200%;height:100%;object-fit:cover;max-width:none}
.note{max-width:640px;margin:22px auto 0;font-size:13px;color:var(--mut)}
.note b{color:var(--fg)}
@media (max-width:520px){.stage{min-height:auto;padding:8px 0}}
</style></head><body><main>
<h1>iPhone Duo 壁纸预览</h1>
<p class="mut">模拟效果：合上看外屏，打开看内屏。真机的裁切和时钟位置以 Apple Store 实测为准。<a href="./">回到下载页</a></p>
<div class="sets" id="sets"></div>
<div class="bar">
  <button class="chip main" id="fold">打开</button>
  <button class="chip" id="empty" aria-pressed="false">空版</button>
  <button class="chip" id="icons" aria-pressed="false">显示图标</button>
  <button class="chip" id="clock" aria-pressed="true">显示时钟</button>
</div>
<div class="stage"><div class="dev" id="dev"></div></div>
<p class="note"><b>外屏</b> 1398×2034，<b>内屏</b> 2670×1878，中间是折痕。这里按「外屏一张、内屏一张」显示，需要两张分别设置（或用快捷指令切换）。</p>
</main>
<script>
const SETS=[
 {k:'chanel-flap',n:'香奈儿 CF 包'},
 {k:'rimowa',n:'Rimowa 登机箱'},
 {k:'mcd-bigmac',n:'麦当劳巨无霸'},
 {k:'fridge-retro',n:'奶油粉复古冰箱'},
 {k:'cola3',n:'可口可乐起雾冰柜'}
];
const V='1125d'; // bump when images change
const OUT=[1398,2034], INN=[2670,1878];
let cur=SETS[0].k, open=false, empty=false, icons=false, clock=true;
try{const s=JSON.parse(localStorage.getItem('duoPrev')||'{}'); if(SETS.some(x=>x.k===s.cur))cur=s.cur}catch(e){}
const $=id=>document.getElementById(id), dev=$('dev');
const setsEl=$('sets');
SETS.forEach(s=>{const b=document.createElement('button');b.className='chip';b.textContent=s.n;b.onclick=()=>{cur=s.k;save();render(false)};b.dataset.k=s.k;setsEl.appendChild(b)});
function save(){try{localStorage.setItem('duoPrev',JSON.stringify({cur}))}catch(e){}}
// preload
SETS.forEach(s=>['closed','open','empty'].forEach(v=>{const i=new Image();i.src=`img/${s.k}-${v}.jpg?v=${V}`}));
function size(){
  const maxW=Math.min(innerWidth-32,940), maxH=Math.min(innerHeight*0.68,620);
  const [w,h]=open?INN:OUT; const r=w/h;
  let H=maxH, W=H*r; if(W>maxW){W=maxW;H=W/r}
  return [Math.round(W),Math.round(H)];
}
function now(){const d=new Date();const wk='日一二三四五六'[d.getDay()];
  return {t:d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false}),d:`${d.getMonth()+1}月${d.getDate()}日 星期${wk}`}}
function render(animate){
  [...setsEl.children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===cur));
  $('fold').textContent=open?'合上':'打开';
  $('empty').setAttribute('aria-pressed',empty);$('icons').setAttribute('aria-pressed',icons);$('clock').setAttribute('aria-pressed',clock);
  const [W,H]=size(); dev.style.width=W+'px'; dev.style.height=H+'px';
  const bz=Math.max(5,Math.round(W*(open?0.011:0.02))), r=Math.round((open?H:W)*0.085);
  dev.style.setProperty('--bz',bz+'px'); dev.style.setProperty('--r',r+'px');
  const src=open?`img/${cur}-${empty?'empty':'open'}.jpg?v=${V}`:`img/${cur}-closed.jpg?v=${V}`;
  const sw=W-2*bz, sh=H-2*bz, unit=open?sw/2:sw;
  const ts=Math.round(unit*0.2), ds=Math.round(unit*0.052);
  const t=now();
  let html=`<div class="frame"><div class="screen"><img src="${src}" alt="">`;
  if(open) html+=`<div class="crease"></div>`;
  html+=`<div class="cam" style="${open?'left:73%':'left:50%;transform:translateX(-50%)'}"></div>`;
  if(clock) html+=`<div class="lock" style="${open?'left:0;width:50%':'left:0;right:0'}"><div class="d" style="font-size:${ds}px">${t.d}</div><div class="t" style="font-size:${ts}px">${t.t}</div></div>`;
  if(icons){const cols=open?8:4, rows=open?3:4, ic=Math.round(unit*0.15), pad=open?0.06:0.1;
    html+=`<div class="icons" style="left:${pad*100}%;right:${pad*100}%;top:${open?40:42}%;grid-template-columns:repeat(${cols},${ic}px);justify-content:space-between;row-gap:${Math.round(ic*0.45)}px">${'<i></i>'.repeat(cols*rows)}</div>`}
  if(open&&animate){html+=`<div class="flap" id="flap" style="transform:rotateY(0deg)"><img src="img/${cur}-closed.jpg?v=${V}" style="width:100%"></div>`}
  html+=`</div></div>`;
  dev.innerHTML=html;
  if(open&&animate){const f=$('flap');requestAnimationFrame(()=>requestAnimationFrame(()=>{f.style.transform='rotateY(-180deg)'}));setTimeout(()=>f.remove(),760)}
}
$('fold').onclick=()=>{open=!open;render(open)};
$('empty').onclick=()=>{empty=!empty;if(!open)open=true;render(false)};
$('icons').onclick=()=>{icons=!icons;render(false)};
$('clock').onclick=()=>{clock=!clock;render(false)};
addEventListener('resize',()=>render(false));
setInterval(()=>{if(clock)render(false)},30000);
render(false);
</script>
</body></html>
